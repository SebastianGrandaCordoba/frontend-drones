# Blueprint de Render: sitio estático del frontend.
# En Render: New > Blueprint > seleccione este repositorio.
services:
  - type: web
    name: frontend-drones
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        # URL pública del backend en Render, terminada en /api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
